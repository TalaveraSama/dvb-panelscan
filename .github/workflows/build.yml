name: Ubuntu packages
on:
  push:
    branches: [arena/6e165552-dvb-panelscan]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified v0.8.1 release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libdvbcsa-dev
      - run: make -C dvb2m3u8 && make -C tbsstream
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: |
          node --check panel/static/app.js
          npm install --prefix /tmp/dvb-panel-ui jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH=/tmp/dvb-panel-ui/node_modules node tests/test_ui.cjs
      - run: |
          make -C dvb2m3u8
          make -C tbsstream
          gcc -O1 -g -fsanitize=address,undefined -o /tmp/test-demux tests/test_demux.c tbsstream/csa.c tbsstream/newcamd.c -ldvbcsa -lcrypto -lpthread
          /tmp/test-demux
          gcc -O1 -g -fsanitize=address,undefined -o /tmp/test-eit-scan tests/test_eit_scan.c
          /tmp/test-eit-scan
          gcc -O1 -g -fsanitize=address,undefined -o /tmp/test-transport tests/test_transport.c tbsstream/csa.c tbsstream/newcamd.c -ldvbcsa -lcrypto -lpthread
          /tmp/test-transport
          gcc -O1 -g -fsanitize=address,undefined -o /tmp/test-newcamd tests/test_newcamd.c -lcrypto
          /tmp/test-newcamd
          gcc -O1 -g -fsanitize=address,undefined -o /tmp/test-broker tests/test_broker.c -lcrypto
          /tmp/test-broker
          gcc -O1 -g -fsanitize=address,undefined -o /tmp/test-csa tests/test_csa.c tbsstream/csa.c -ldvbcsa
          /tmp/test-csa
      - run: sh packaging/build-deb.sh 0.8.1
      - run: |
          sudo apt-get install -y ./dist/*.deb
          sudo systemctl start dvb-panel
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8081/api/status
          sudo systemctl stop dvb-panel
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-22.04-amd64
          path: dist/*.deb
      - name: Publish release
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v0.8.1'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          gh release create v0.8.1 *.deb SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v0.8.1 · EPG de varios días y perfiles por canal · Ubuntu" --notes-file ../RELEASE_NOTES.md
